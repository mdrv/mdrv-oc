# yaml-language-server: $schema=https://carapace.sh/schemas/command.json
name: mdrv-oc
description: Inspect and manipulate the OpenCode SQLite database
persistentflags:
  -j, --json: Emit machine-readable JSON instead of human text
  --pretty: Indented, pretty JSON (implies --json)
  -q, --quiet: Suppress non-result commentary
  --db=: Path to opencode.db
completion:
  flag:
    db: ["$files"]
commands:
  - name: session
    description: Inspect or modify sessions
    commands:
      - name: list
        description: List sessions, newest first
        flags:
          --limit=: How many sessions to show
          --server: List from the running OpenCode service instead of the local DB
          --directory=: With --server: restrict to this project directory
      - name: show
        description: Show one session (id, id prefix, slug, or title substring)
        completion:
          positional:
            - ["$(mdrv-oc __complete sessions)"]
      - name: move
        aliases: [mv]
        description: Change a session's directory (and optionally its project)
        flags:
          --project=: Also set session.project_id to this exact project id
          --auto-project: Infer project_id from the new directory
          --children: Also rewrite child sessions
          -y, --yes: Skip the confirmation prompt
          --no-backup: Skip the automatic db.bak backup
          --dry-run: Print the planned change without writing
        completion:
          positional:
            - ["$(mdrv-oc __complete sessions)"]
            - ["$directories"]
      - name: export
        description: Export session(s) as self-describing JSON files via opencode
        flags:
          --filter=: Export every session whose slug or title contains TEXT
          --limit=: Cap how many sessions the menu or filter considers (0 = no cap)
          --out=: Output directory for the export files (falls back to $MDRV_OC_OUT, then .)
          --name=: Custom file name (stem) for a single-session export
          --no-compress: Write plain .json instead of .json.zst
          --opencode-bin=: Path to the opencode binary to drive
          -y, --yes: Skip the bulk confirmation prompt
        completion:
          flag:
            out: ["$directories"]
            name: [=]
            opencode-bin: ["$executables"]
          positionalany:
            - "$(mdrv-oc __complete sessions)"
      - name: import
        description: Import session export file(s) via opencode import
        flags:
          --into=: Re-anchor imported session(s) to this directory's project
          -y, --yes: Skip the confirmation prompt (imports the recommended set)
          --no-backup: Skip the automatic db.bak backup
          --opencode-bin=: Path to the opencode binary to drive
        completion:
          flag:
            into: ["$directories"]
            opencode-bin: ["$executables"]
          positionalany:
            - "$files([.json, .zst])"
            - "$directories"
      - name: sync
        description: Two-way convergence with a synced directory (pull, then push)
        flags:
          --filter=: Limit the push side to sessions whose slug or title contains TEXT
          --existing: Only push sessions that already have a copy in DIR (no new files)
          --no-compress: Write plain .json for new exports instead of .json.zst
          -y, --yes: Skip the confirmation prompt (runs the recommended plan)
          --no-backup: Skip the automatic db.bak backup before the pull
          --opencode-bin=: Path to the opencode binary to drive
        completion:
          flag:
            opencode-bin: ["$executables"]
          positional:
            - ["$directories"]
      - name: inspect
        description: Peek inside export file(s) or directory(ies) without importing
        completion:
          positionalany:
            - "$files([.json, .zst])"
            - "$directories"
      - name: prompt
        aliases: [say]
        description: Send a prompt to a running OpenCode session — now or on a schedule
        flags:
          --file=: Read the prompt text from this file ("-" = stdin)
          -s, --session=: Target session id (or unique id prefix); omit to pick interactively
          --at=: Deliver at this local time (RFC3339, "YYYY-MM-DD HH:MM", "HH:MM", "tomorrow HH:MM")
          --in=: Deliver after this duration (90s, 45m, 2h, 1d, 1h30m)
          --agent=: Switch the session to this agent before prompting
          --model=: Switch the session to this model (PROVIDER/ID) before prompting
          --url=: OpenCode server URL override (else $MDRV_OC_SERVER_URL, else the running service)
        commands:
          - name: list
            description: List scheduled and recent prompts
          - name: cancel
            description: Cancel a pending scheduled prompt (id or unique prefix)
  - name: daemon
    description: Run the prompt-scheduler daemon in the foreground
    flags:
      --once: Fire due prompts once and exit
  - name: project
    description: Inspect projects
    commands:
      - name: list
        description: List all known projects
      - name: show
        description: Show one project by exact id
        completion:
          positional:
            - ["$(mdrv-oc __complete projects)"]
